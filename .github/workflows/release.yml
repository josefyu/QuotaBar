name: Release

# Publishes this fork's own Windows build. Upstream's WinGet submission step is
# deliberately absent: CodeZeno.ClaudeCodeUsageMonitor is their package, and a
# fork must not push its binary into it.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Run tests
        run: cargo test --release

      - name: Write SHA256 checksum
        shell: pwsh
        run: |
          $exe = "target/release/claude-code-usage-monitor.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  claude-code-usage-monitor.exe" |
            Out-File -Encoding ascii "$exe.sha256"
          Write-Host "SHA256: $hash"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-code-usage-monitor
          path: |
            target/release/claude-code-usage-monitor.exe
            target/release/claude-code-usage-monitor.exe.sha256

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/claude-code-usage-monitor.exe
            target/release/claude-code-usage-monitor.exe.sha256
          generate_release_notes: true
